<body class="bw-game-body">
<header id="global-header" aria-label="Binary World 공통 메뉴"></header>

<main class="bw-game-portal">
    <section class="bw-game-hero" aria-label="게임 포털 소개">
        <div class="bw-game-hero-plane" aria-hidden="true"></div>
        <div class="bw-game-hero-inner">
            <p class="bw-game-brand">Binary World</p>
            <h1 class="bw-game-headline">미니게임 포털</h1>
            <p class="bw-game-lead">무궁화·핀볼룰렛·말달리자로 커피내기·점심내기·벌칙뽑기. 사다리·룰렛 대신 지금 바로 즐기세요.</p>
        </div>
    </section>

    <section id="games" class="bw-game-section">
        <!--/*
          목록의 출처는 GameCatalog 하나다 (순서·묶음·새로 나온 게임 모두).
          카드는 전부 같은 모양이다. 예전에 무궁화만 크게 띄웠더니 나머지가 들러리로 보였고,
          신작을 테두리·배지 띠로 올렸더니 광고처럼 보였다. 그래서 새 게임도 같은 카드에 소제목만 따로 둔다.
        */-->
        <div class="bw-game-group" th:if="${featuredGame != null}">
            <div class="bw-game-group-head">
                <h2>새로 나온 게임</h2>
            </div>
            <a th:href="@{${featuredGame.path}}" class="bw-game-card bw-game-card-wide">
                <img th:src="@{${featuredGame.card}}" th:alt="${featuredGame.name}"
                     width="600" height="400" decoding="async" loading="eager">
                <div class="bw-game-card-body">
                    <span class="bw-game-card-kicker"><b class="bw-game-new">NEW</b> <span th:text="${featuredGame.kicker}">Aquarium</span></span>
                    <h3 th:text="${featuredGame.name}">펭귄 키우기</h3>
                    <p th:text="${featuredGame.tagline}">한 줄 설명</p>
                </div>
            </a>
        </div>

        <div class="bw-game-group">
            <div class="bw-game-group-head">
                <h2>내기·복불복</h2>
                <p>커피내기·점심내기·벌칙뽑기, 여럿이 결과 뽑기</p>
            </div>
            <div class="bw-game-grid">
                <a th:each="g, s : ${betGames}" th:href="@{${g.path}}" class="bw-game-card">
                    <img th:src="@{${g.card}}" th:alt="${g.name}"
                         width="600" height="400" decoding="async"
                         th:attr="loading=${s.first} ? 'eager' : 'lazy'">
                    <div class="bw-game-card-body">
                        <span class="bw-game-card-kicker"><b class="bw-game-new" th:if="${g.isNew()}">NEW</b> <span th:text="${g.kicker}">Pick</span></span>
                        <h3 th:text="${g.name}">게임 이름</h3>
                        <p th:text="${g.tagline}">한 줄 설명</p>
                    </div>
                </a>
            </div>
        </div>

        <div class="bw-game-group">
            <div class="bw-game-group-head">
                <h2>혼자 즐기기</h2>
                <p>키우기·리듬·아케이드</p>
            </div>
            <div class="bw-game-grid">
                <a th:each="g, s : ${soloGames}" th:href="@{${g.path}}" class="bw-game-card">
                    <img th:src="@{${g.card}}" th:alt="${g.name}"
                         width="600" height="400" decoding="async"
                         th:attr="loading=${false} ? 'eager' : 'lazy'">
                    <div class="bw-game-card-body">
                        <span class="bw-game-card-kicker"><b class="bw-game-new" th:if="${g.isNew()}">NEW</b> <span th:text="${g.kicker}">Pick</span></span>
                        <h3 th:text="${g.name}">게임 이름</h3>
                        <p th:text="${g.tagline}">한 줄 설명</p>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <div id="bw-guestbook" aria-label="방명록"></div>
</main>

<footer id="global-footer" aria-label="Binary World 푸터"></footer>

<script src="https://binaryworld.kr/common/header.js" defer></script>
