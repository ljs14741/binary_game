<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  게임 페이지 하단에 붙는 공통 "다른 게임" 섹션.

  게임 하나를 끝낸 직후가 다음 행동을 고르는 순간이라 여기서 이탈을 막는다.
  이 섹션이 없을 때는 게임 페이지에서 다른 게임으로 가는 링크가 하나도 없었다.

  쓰는 법 — 인자가 없다. 현재 경로는 GameCatalogAdvice 가 알아서 판단한다.
    <div th:replace="~{fragments/other-games :: otherGames}"></div>

  목록의 출처는 GameCatalog 하나뿐이다. 현재 게임은 빠지고, 개수도 거기서 제한한다.

  스타일을 여기 같이 둔 이유: main-dark.css / main-light.css 두 벌을 모두 고치지 않고
  한 파일에서 관리하기 위해서다. 테마는 <html data-theme>로 구분한다 (theme.js가 세팅).
*/-->
<section class="bw-other-games" th:fragment="otherGames" th:if="${otherGames != null and !otherGames.isEmpty()}">
    <style>
        .bw-other-games {
            max-width: 960px;
            margin: 48px auto 24px;
            padding: 0 16px;
        }

        .bw-other-games > h2 {
            margin: 0 0 16px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #e8ecf1;
        }

        .bw-other-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .bw-other-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #262b33;
            border-radius: 12px;
            background: #14181e;
            color: #e8ecf1;
            text-decoration: none;
            transition: transform .15s ease, border-color .15s ease;
        }

        .bw-other-card:hover,
        .bw-other-card:focus-visible {
            transform: translateY(-2px);
            border-color: #4a90d9;
        }

        .bw-other-card img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            background: #0b0d10;
        }

        .bw-other-card span {
            padding: 10px 12px;
            font-size: .88rem;
            font-weight: 600;
            line-height: 1.35;
        }

        :root[data-theme="light"] .bw-other-games > h2 {
            color: #1b2028;
        }

        :root[data-theme="light"] .bw-other-card {
            border-color: #d9dee6;
            background: #ffffff;
            color: #1b2028;
        }

        :root[data-theme="light"] .bw-other-card img {
            background: #eef1f5;
        }

        @media (prefers-reduced-motion: reduce) {
            .bw-other-card {
                transition: none;
            }

            .bw-other-card:hover,
            .bw-other-card:focus-visible {
                transform: none;
            }
        }
    </style>

    <h2>다른 게임도 해보세요</h2>

    <div class="bw-other-grid">
        <a th:each="g : ${otherGames}" th:href="@{${g.path}}" class="bw-other-card">
            <img th:src="@{${g.card}}" th:alt="${g.name}" width="600" height="400" loading="lazy" decoding="async">
            <span th:text="${g.name}">게임 이름</span>
        </a>
    </div>
</section>

</body>
</html>
