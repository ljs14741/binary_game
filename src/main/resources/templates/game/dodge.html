<!DOCTYPE html>
<html lang="ko">
<head>
    <title>총알 피하기 - Binary World</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="빠르게 날아오는 총알을 피하며 최대한 오래 살아남는 총알 피하기 미니게임.">
    <meta name="keywords" content="총알 피하기, 미니게임, 생존 게임, Binary World">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Binary World">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="총알 피하기 - Binary World">
    <meta property="og:description" content="빠르게 날아오는 적을 피해 생존 점수를 겨뤄보세요.">
    <meta property="og:image" content="https://game.binaryworld.kr/img/radish.png">
    <meta property="og:url" content="https://game.binaryworld.kr/dodge">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="총알 피하기 - Binary World">
    <meta name="twitter:description" content="빠르게 날아오는 총알을 피하며 생존 점수를 기록하세요.">
    <meta name="twitter:image" content="https://game.binaryworld.kr/img/radish.png">

    <!-- 기본 파비콘 -->
    <link rel="icon" href="/img/favicon/favicon.ico" type="image/x-icon">

    <!-- 다양한 디바이스 아이콘 -->
    <link rel="apple-touch-icon" sizes="57x57" href="/img/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/img/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/img/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/img/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/img/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/img/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/img/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">

    <!-- manifest와 윈도우용 타일 설정 -->
    <link rel="manifest" href="/img/favicon/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">

    <meta name="_csrf" th:content="${_csrf.token}"/>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <link id="theme-style" rel="stylesheet" th:href="@{/css/main-dark.css}">

    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6890085609044109"
            crossorigin="anonymous"></script>
</head>
<body>
<th:block th:include="common/header"></th:block>

<div class="main-content">
    <div class="container">

        <div class="nav-back">
            <a href="/" class="back-btn">🏠 홈으로 돌아가기</a>
        </div>

        <div class="game-title">🎯 총알 피하기</div>

        <div class="game-bgm">
            <button id="bgmToggle">🎵 BGM 끄기/켜기</button>
            <label for="volumeControl">BGM 볼륨:</label>
            <input type="range" id="volumeControl" min="0" max="100" value="100">
        </div>

        <div id="game-container"></div>

        <div class="icon-container">
            <a id="btnTwitter" class="link-icon twitter" href="javascript:shareTwitter();"></a>
            <a id="btnFacebook" class="link-icon facebook" href="javascript:shareFacebook();"></a>
            <a id="btnKakao" class="link-icon kakao" href="javascript:shareKakao();"></a>
        </div>

        <div class="description">
            <h2>게임 설명</h2>
            <p>
                빠르게 날아오는 적을 피하며 생존 시간을 늘리는 미니게임입니다.<br>
                키보드 또는 터치로 캐릭터를 조작해 적을 피하고 점수를 높이세요!<br>
                <strong>무적</strong> 아이템과 <strong>폭탄</strong> 아이템을 활용해 최고 기록에 도전해 보세요.
            </p>
        </div>
    </div>
</div>

<th:block th:include="common/footer"></th:block>

<div class="side-ad left-ad">
    <ins class="kakao_ad_area"
         style="display:none;"
         data-ad-unit="DAN-ePAs1c7mONqnY32w"
         data-ad-width="160"
         data-ad-height="600"></ins>
</div>

<div class="side-ad right-ad">
    <ins class="kakao_ad_area"
         style="display:none;"
         data-ad-unit="DAN-qpEsz6jYmwJE0cE7"
         data-ad-width="160"
         data-ad-height="600"></ins>
</div>

<script th:src="@{/js/phaser.min.js}"></script>
<script th:src="@{/js/dodge.js}"></script>
<script>
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');

    document.addEventListener('DOMContentLoaded', function () {
        // 1. 햄버거 메뉴 토글
        const toggleBtn = document.querySelector('.nav-toggle');
        const nav = document.querySelector('.nav-links');

        if (toggleBtn && nav) {
            toggleBtn.addEventListener('click', () => {
                toggleBtn.classList.toggle('active');
                nav.classList.toggle('open');
            });
        }

        // 2. 테마 토글
        const themeToggle = document.getElementById('themeToggle');
        const themeLink = document.getElementById('theme-style');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        applyTheme(currentTheme);

        if (themeToggle && themeLink) {
            themeToggle.addEventListener('click', () => {
                const isDark = themeLink.getAttribute('href').includes('dark');
                const nextTheme = isDark ? 'light' : 'dark';
                applyTheme(nextTheme);
            });
        }

        function applyTheme(theme) {
            themeLink.setAttribute('href', `/css/main-${theme}.css`);
            localStorage.setItem('theme', theme);
        }
    });

    function shareTwitter() {
        var sendText = "총알피하기 게임";
        var sendUrl = "https://game.binaryworld.kr/dodge";
        window.open("https://twitter.com/intent/tweet?text=" + sendText + "&url=" + sendUrl);
    }

    function shareFacebook() {
        var sendUrl = "https://game.binaryworld.kr/dodge";
        window.open("http://www.facebook.com/sharer/sharer.php?u=" + sendUrl);
    }

    function setupKakaoShareButton() {
        if (!window.Kakao) return;
        if (!document.querySelector('#btnKakao')) return;

        if (!Kakao.isInitialized()) {
            Kakao.init('8b68c737be6b8e9a8007c61ee6f9b8da');
        }

        Kakao.Share.createDefaultButton({
            container: '#btnKakao',
            objectType: 'feed',
            content: {
                title: '총알피하기 게임',
                description: '친구들과 경쟁해보세요~',
                imageUrl: 'https://game.binaryworld.kr/img/radish.png',
                link: {
                    mobileWebUrl: 'https://game.binaryworld.kr/dodge',
                    webUrl: 'https://game.binaryworld.kr/dodge'
                }
            }
        });
    }

    setupKakaoShareButton();

</script>
</body>
</html>
