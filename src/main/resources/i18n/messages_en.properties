wheel.ld.description=Free online spin wheel with your own names. Hit it with a hammer; the harder you hit, the longer it spins. One spin decides one thing.
wheel.ld.keywords=spin the wheel, wheel spinner, random name picker, decision wheel, random picker, lunch picker
wheel.faq.q1=Can I put my own names on the wheel?
wheel.faq.a1=Yes. Use 2 to 8 slices and type any name or option into each one. Empty slices are numbered 1, 2, 3 automatically.
wheel.faq.q2=Can I use it to pick lunch?
wheel.faq.a2=Yes. Put the candidate dishes in the slices and spin once. Same for who buys coffee, who does the dare, chores, or any random draw.
wheel.faq.q3=Does the hammer power affect the result?
wheel.faq.a3=No. Power only sets how many turns (2.6 to 9.2) and how long it spins (2.2 to 5 seconds). Where it stops can't be aimed — random hit error and deceleration are mixed in, so every slice has exactly the same odds.
wheel.faq.q4=Does it work on mobile?
wheel.faq.a4=Yes. It's designed for a portrait phone screen and works the same on desktop. Tap the screen or the Smash button; on desktop you can also press the space bar.

