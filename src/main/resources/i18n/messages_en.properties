ladder.help.title=How to play
ladder.help.1=Choose the number of players and losing spots, then press <strong>Build the ladder</strong>.
ladder.help.2=The <strong>finish line</strong> at the bottom shows which spots lose from the start. You know where not to end up.
ladder.help.3=Pick a starting number and water flows down from there.
ladder.help.4=You can only see the top of the path. <strong>Below the dotted line it's hidden, and it reshuffles every turn.</strong> No one knows until the very end.
ladder.help.5=Take turns one at a time. The fewer players left, the higher the odds of losing.
ladder.help.6=In a hurry? Press <strong>Skip</strong> to jump to the result.
ladder.help.note=Pure luck. Once you've picked, nobody can change the outcome.

