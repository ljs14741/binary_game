wheel.help.1=<strong>Write what goes on the wheel.</strong> Names, dishes, anything. Empty slices become 1, 2, 3.
wheel.help.2=The gauge sweeps from 0 to 100. Press <strong>SMASH</strong> and the hammer hits the wheel with that power.
wheel.help.3=<strong>Harder hits spin longer.</strong> But you can't aim where it stops — every slice has the same odds.
wheel.help.4=Whatever the pointer lands on <strong>wins</strong>. One spin, done.

