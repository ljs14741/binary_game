roulette.help.title=게임 방법
roulette.help.1=물이 든 풍선 하나와 펌프를 <strong>돌려 씁니다.</strong> 판 내내 같은 풍선입니다.
roulette.help.2=내 차례가 되면 <strong>펌프질을 연달아</strong> 합니다. 한 번 시작하면 못 멈춥니다. (인원이 적을수록 여러 번 합니다)
roulette.help.3=누를 때마다 풍선이 <strong>한 단계 커집니다.</strong> 클수록 위험합니다.
roulette.help.4=펌프질 직후 풍선이 <strong>부르르 떱니다.</strong> 이때는 어느 쪽인지 알 수 없습니다.
roulette.help.5=안 터지면 <strong>다음 사람에게</strong> 넘어갑니다.
roulette.help.6=터뜨린 사람이 <strong>물벼락</strong>, 벌칙입니다.
roulette.help.note=남은 횟수를 세지 않아도 됩니다. <strong>풍선 크기가 곧 확률입니다.</strong> 순서에 유불리는 없습니다.

