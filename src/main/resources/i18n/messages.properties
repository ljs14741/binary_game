wheel.meta.title=원판돌리기 - 이름 넣고 돌리는 온라인 돌림판 | 해머 원판돌리기 | Binary World
wheel.meta.description=이름을 직접 넣어 만드는 온라인 원판돌리기. 해머로 쳐서 돌리고, 세게 칠수록 오래 돕니다. 점심 메뉴 정하기·커피내기·벌칙뽑기·랜덤 뽑기까지 하나만 고르면 되는 순간에 쓰세요.
wheel.meta.keywords=원판돌리기, 돌림판, 온라인 돌림판, 돌림판 만들기, 룰렛 돌리기, 랜덤 뽑기, 제비뽑기, 점심 메뉴 룰렛, 점심 메뉴 정하기, 저녁 메뉴 추천, 이름 뽑기, 커피내기, 벌칙뽑기, 복불복게임, 파티게임, Binary World
wheel.meta.ogTitle=원판돌리기 - 이름 넣고 돌리는 온라인 돌림판 | Binary World
wheel.meta.ogDescription=해머로 쳐서 돌리는 원판돌리기. 점심 메뉴·커피내기·벌칙뽑기, 하나만 정하면 될 때!
wheel.ld.name=해머 원판돌리기
wheel.ld.alt1=원판돌리기
wheel.ld.alt2=돌림판
wheel.ld.alt3=온라인 돌림판
wheel.ld.alt4=룰렛 돌리기
wheel.ld.description=이름을 직접 넣어 만드는 온라인 원판돌리기. 해머로 쳐서 돌리고 세게 칠수록 오래 돈다. 한 번 돌려 하나를 정한다.
wheel.ld.keywords=원판돌리기, 돌림판, 온라인 돌림판, 랜덤 뽑기, 제비뽑기, 점심 메뉴 정하기, 커피내기, 벌칙뽑기
wheel.faq.q1=원판돌리기에 이름을 직접 넣을 수 있나요?
wheel.faq.a1=네. 칸을 2~8개까지 늘리고 각 칸에 원하는 이름이나 메뉴를 직접 입력할 수 있습니다. 비워두면 1번, 2번처럼 번호로 자동으로 채워집니다. 최근에 쓴 목록 3벌은 저장되어 다음에 한 번에 불러올 수 있습니다.
wheel.faq.q2=점심 메뉴 정하기에도 쓸 수 있나요?
wheel.faq.a2=네. 김치찌개, 돈까스처럼 후보 메뉴를 칸에 넣고 한 번 돌리면 하나가 정해집니다. 커피내기, 벌칙뽑기, 청소 당번 정하기, 제비뽑기 등 하나만 고르면 되는 모든 상황에 쓸 수 있습니다.
wheel.faq.q3=해머 세기가 결과에 영향을 주나요?
wheel.faq.a3=아니요. 세기는 원판이 몇 바퀴 도는지(2.6~9.2바퀴)와 도는 시간(2.2~5초)만 정합니다. 어느 칸에 멈출지는 정할 수 없습니다. 타격 오차만으로 원판이 반 바퀴씩 흔들리기 때문에 노려서 맞출 수가 없고, 모든 칸의 당첨 확률은 정확히 같습니다.
wheel.faq.q4=모바일에서도 되나요?
wheel.faq.a4=됩니다. 휴대폰 세로 화면을 기준으로 만들었고 PC에서도 그대로 동작합니다. 화면을 누르거나 내려찍기 버튼을 누르면 되고, PC에서는 스페이스바로도 칠 수 있습니다. 설치나 로그인은 필요 없습니다.

