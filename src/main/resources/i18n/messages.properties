rhythm.help.title=뿌셔뿌셔 리듬게임
rhythm.help.intro=호루라기가 리듬을 들려주면, 다음 마디에 로봇 <strong>비트</strong>가 똑같이 따라 치며 벽과 창문과 굴뚝을 부수는 리듬게임입니다. 귀로 듣고 손으로 치면 됩니다.
rhythm.help.controlsTitle=조작법
rhythm.help.c1=PC는 <strong>스페이스바</strong>(또는 엔터·F·J·D·K), 모바일은 <strong>화면 터치</strong>.
rhythm.help.c2=호루라기 신호를 잘 듣고 <strong>다음 마디에 같은 타이밍</strong>으로 치세요.
rhythm.help.c3=<strong>하트 3개</strong>가 목숨입니다. 너무 이르거나 늦으면 하나씩 잃고, 0개가 되면 실패.
rhythm.help.c4=정확도 70·85·95%로 <strong>동·은·금 메달</strong>. 메달을 따야 다음 스테이지가 열립니다.
rhythm.help.stagesTitle=스테이지
rhythm.help.s1=벽 부수기, 창문 깨기, 굴뚝 무너뜨리기, 판자 뜯기, 그리고 전부 섞은 <strong>리믹스</strong>. 하드모드는 더 빠르고 하트가 1개뿐입니다.
rhythm.help.s2=<strong>히든 스테이지</strong>도 하나 숨어 있어요. 판정도 목숨도 없이 마음껏 부수기만 하는 <strong>"스트레스 뿌셔뿌셔!"</strong> — 월드맵 맨 위에 있습니다.
rhythm.help.s3=박자가 자꾸 어긋나면 제목 화면의 <strong>박자 보정</strong>을 한 번 해보세요. 기기마다 다른 소리 지연을 맞춰 줍니다.

