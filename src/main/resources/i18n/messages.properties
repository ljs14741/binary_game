press.meta.description=조진세의 턱압프레스가 생각나는 벌칙 게임. 레버를 당길 때마다 검은 쫄쫄이 사나이의 턱이 유압프레스처럼 내려와 수박을 찌그러뜨립니다. 언제 터질지는 아무도 모릅니다. 커피내기·점심내기·벌칙뽑기에 딱.
