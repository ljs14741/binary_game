wheel.help.1=<strong>돌림판에 넣을 것을 적습니다.</strong> 사람 이름이든 점심 메뉴든 상관없습니다. 비워두면 1번·2번으로 들어갑니다.
wheel.help.2=게이지가 0에서 100 사이를 왕복합니다. <strong>내려찍기</strong>를 누르면 그 세기로 해머가 원판을 칩니다.
