penguin.guide.tapWater=<b>물을 톡</b> → 먹이가 떨어져요 (5코인). 배고픈 펭귄 머리 위에 말풍선이 떠요.
penguin.guide.tapCoin=<b>코인을 톡</b> → 주워요. 누른 채 문질러도 돼요. 바닥에 오래 두면 사라져요.
penguin.guide.tapPred=<b>천적을 톡톡</b> → 눈덩이를 던져요. 쓰러뜨리면 보물상자!
penguin.guide.growTitle=펭귄이 크는 법
penguin.guide.grow=먹이를 먹으면 <b>아기 → 꼬마 → 어른</b>으로 자라요. 꼬마는 은화, 어른은 금화를 떨궈요.
penguin.guide.hunger=너무 오래 굶으면 파랗게 질리고, 결국 떠나 버려요.
penguin.guide.shopTitle=상점 (판마다 처음부터)
penguin.guide.shopPenguin=<b>펭귄</b> — 많을수록 코인이 많이 나와요. 다른 펭귄은 레벨을 깨면 열려요.
penguin.guide.shopFood=<b>먹이 등급</b> — 크릴 → <b>새우</b> → 고등어. 좋은 먹이일수록 빨리 크고 오래 배불러요.
penguin.guide.shopFoodCount=<b>먹이 +1</b> — 처음엔 물에 먹이가 1개만 떠 있을 수 있어요. 사면 한 번에 더 많이 떨어뜨려요.
penguin.guide.shopHold=상점 칸을 <b>꾹 누르면</b> 사지 않고 설명만 볼 수 있어요.
penguin.guide.shopOtter=<b>해달 +1</b> — Lv3을 깬 뒤부터 해달을 더 살 수 있어요. 배고픈 펭귄에게 알아서 먹이를 줘요.
penguin.guide.shopWeapon=<b>눈덩이</b> — 천적을 누를 때 던지는 눈덩이. 레벨을 올리면 한 번에 더 세게 때려요.
penguin.guide.predTitle=천적과 보스
penguin.guide.pred=도둑갈매기·표범물범·상어가 펭귄을 노려요. 3초 전에 경고가 뜨니 빨리 톡톡!
penguin.guide.predMove=천적마다 움직임이 달라요. 상어의 <b>빨간 선</b>은 돌격 예고! 여러 대 맞으면 <b>화나서</b> 잠깐 빨라져요.
penguin.guide.boss=<b>5·10·15레벨은 보스 판.</b> 조각 2개를 사면 보스가 오고, 쓰러뜨리면 마지막 조각을 떨궈요.
penguin.guide.medalTitle=메달
penguin.guide.medalGold=<b>금메달</b> — 레벨마다 정해진 시간 안에 클리어
penguin.guide.medalSilver=<b>은메달</b> — 금메달 시간의 1.5배 안에 클리어
penguin.guide.medalBronze=<b>동메달</b> — 그보다 늦게 클리어
penguin.guide.medalHud=판 중엔 왼쪽 위에 <b>지금 깨면 받는 메달과 마감 시간</b>이 보여요. 받은 메달은 지도에 색으로 남고, 다시 해서 올릴 수 있어요.
penguin.guide.levelTitle=레벨과 친구
penguin.guide.level=레벨은 <b>총 15개</b>예요 (얼음 연못 1~5 · 빙하 동굴 6~10 · 깊은 바다 11~15). 하나 깰 때마다 황금알에서 새 펭귄이나 친구가 나와 다음 레벨부터 함께해요. 진행은 자동 저장돼요.
penguin.guide.trait=Lv3부터는 <b>판마다 특징</b>(해류·폭식·황금 조류 등)이 있고, 가끔 <b>코인 비·보물상자·황금 크릴</b> 같은 깜짝 이벤트가 터져요.
penguin.guide.dex=누가 누군지 궁금하면 <b>펭귄 도감</b>을 보세요. 펭귄·친구·천적·아이템이 다 있어요.
penguin.guide.bonus=앞 레벨을 <b>금메달</b>로 깨면 다음 판을 코인 보너스와 함께 시작해요 (은메달은 절반).

penguin.help.title=펭귄 키우기 하는 법
penguin.help.s1=물 톡 → 먹이 떨어짐
penguin.help.s2=펭귄이 먹고 크면 코인 떨굼 → 톡 해서 줍기
penguin.help.s3=코인으로 펭귄·먹이·눈덩이 사기
penguin.help.s4=천적 오면 톡톡 → 눈덩이로 쫓아냄
penguin.help.s5=<strong>황금알 조각 3개</strong> 사면 클리어
penguin.help.retroTitle=추억의 물고기 키우기 그대로
penguin.help.r1=옛날 플래시 게임 <strong>물고기 키우기</strong>, 그때 그 느낌 그대로
penguin.help.r2=15레벨 · 보스 3마리 · 친구 15종 도감
penguin.help.r3=설치·로그인 없이 폰·PC에서 무료, 진행 자동 저장
