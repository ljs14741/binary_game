wheel.meta.description=名前や候補を自分で入れて回す無料オンラインルーレット。ハンマーで叩いて回し、強く叩くほど長く回ります。ランチ決め、おごり決め、罰ゲーム、くじ引き。ひとつだけ決めたいときに。
