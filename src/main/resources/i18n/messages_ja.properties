rhythm.meta.title=ブッシャブッシャ リズムゲーム – リズムに合わせて壁・窓・煙突を壊す無料ワンボタンリズムゲーム | Binary World
rhythm.meta.description=リズムを聞いて同じように叩き返し、壁・窓・煙突を壊す無料リズムゲーム。ボタン1つ（スペースキー・タップ）で遊べるミニゲーム。インストール不要、PC・スマホのブラウザですぐプレイ。
