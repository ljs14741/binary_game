wheel.help.title=遊び方
wheel.help.1=<strong>ルーレットに入れるものを書きます。</strong> 人の名前でもランチのメニューでもOK。空欄は1番・2番になります。
wheel.help.2=ゲージが0から100の間を往復します。<strong>叩く！</strong>を押すと、その強さでハンマーがルーレットを叩きます。
wheel.help.3=<strong>強く叩くほど長く回ります。</strong> でもどこで止まるかは狙えず、すべてのマスの確率は同じです。
wheel.help.4=針が指したひとつが<strong>当たり</strong>。一回回したら終わりです。

