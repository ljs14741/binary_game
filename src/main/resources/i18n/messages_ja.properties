wheel.ld.description=名前を自分で入れて回す無料オンラインルーレット。ハンマーで叩いて回し、強く叩くほど長く回る。一回回してひとつ決める。
wheel.ld.keywords=ルーレット 決め, オンラインルーレット, ランダム抽選, くじ引き, ランチ決め, おごり, 罰ゲーム
wheel.faq.q1=ルーレットに自分で名前を入れられますか？
wheel.faq.a1=はい。マスを2〜8個に増やし、それぞれに好きな名前やメニューを入力できます。空欄は1番、2番のように自動で番号が入ります。
wheel.faq.q2=ランチ決めにも使えますか？
wheel.faq.a2=はい。候補のメニューをマスに入れて一回回せば、ひとつに決まります。おごり決め、罰ゲーム、掃除当番、くじ引きも同じです。
wheel.faq.q3=ハンマーの強さは結果に影響しますか？
wheel.faq.a3=いいえ。強さは回転数（2.6〜9.2回転）と回る時間（2.2〜5秒）だけを決めます。どこで止まるかは狙えません。打撃の誤差と減速にランダムが混ざっていて、すべてのマスの確率は同じです。
wheel.faq.q4=スマホでも使えますか？
wheel.faq.a4=使えます。スマホの縦画面を基準に作られていて、PCでも同じように動きます。画面をタップするか「叩く」ボタンを押すだけ。PCではスペースキーでも叩けます。

