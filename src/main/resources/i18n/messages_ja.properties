rhythm.help.title=ブッシャブッシャ リズムゲーム
rhythm.help.intro=ホイッスルがリズムを鳴らすと、次の小節でロボットの<strong>ビート</strong>が同じように叩き返して壁・窓・煙突を壊すリズムゲームです。耳で聞いて、手で叩くだけ。
rhythm.help.controlsTitle=操作方法
rhythm.help.c1=PCは<strong>スペースキー</strong>（またはEnter・F・J・D・K）、スマホは<strong>画面タップ</strong>。
rhythm.help.c2=ホイッスルの合図をよく聞いて、<strong>次の小節で同じタイミング</strong>で叩きます。
rhythm.help.c3=<strong>ハート3つ</strong>が残機です。早すぎても遅すぎても1つ減り、0になると失敗。
rhythm.help.c4=正確度70・85・95%で<strong>銅・銀・金メダル</strong>。メダルを取ると次のステージが開きます。
rhythm.help.stagesTitle=ステージ
rhythm.help.s1=壁壊し、窓割り、煙突倒し、板はがし、そして全部混ぜた<strong>リミックス</strong>。ハードモードはより速く、ハートは1つだけ。
rhythm.help.s2=<strong>隠しステージ</strong>も1つあります。判定も残機もなく、ひたすら壊すだけの<strong>「ストレス ブッシャブッシャ！」</strong> — ワールドマップの一番上です。
rhythm.help.s3=タイミングがずれ続けるなら、タイトル画面の<strong>タイミング補正</strong>を一度試してください。端末ごとに違う音の遅れを合わせます。

