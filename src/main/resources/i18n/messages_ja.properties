mugunghwa.help.title1=遊び方
mugunghwa.help.step1=参加者名を<strong>カンマまたは改行</strong>で区切って入力（2〜30名）— 賭けに参加する全員の名前
mugunghwa.help.step2=<strong>🏆 優勝を決める</strong>（賭け免除）か<strong>💣 最下位を決める</strong>（当番・罰ゲーム）を選んでスタート！
mugunghwa.help.step3=開始後、キャラクターは<strong>自動で</strong>走って止まります。青信号や氷は演出で、<strong>操作は不要</strong>。結果を見るだけ
mugunghwa.help.step4=最初にゴールした人（優勝）または最初に捕まった人（罰ゲーム）が自動で決まります
mugunghwa.help.title2=特徴
mugunghwa.help.feat1=<strong>おごり決め・当番決め・罰ゲーム</strong>など、あらゆる抽選に最適 — あみだくじ・ルーレット・競馬の代わりに
mugunghwa.help.feat2=<strong>毎ラウンド速度がランダム</strong> — 全員の速度と鬼のかけ声の速さが毎回変わるので、結果は予測不能
mugunghwa.help.feat3=<strong>性格もランダム</strong> — 🔥 猪突型・🚶 普通・🐢 慎重型で反応が違い、いつでも公平な抽選。最大30名、無料
mugunghwa.help.note=<strong>こんな場面に</strong> — ランチのおごり / コーヒーおごり / 掃除当番 / 発表順 / チームの罰ゲーム / 飲み会ゲーム / イベントの抽選

